tags:
  - Contacts
summary: Delete a contact by ID
operationId: deleteContactById
description: Remove a contact from the database using their ID.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: The ID of the contact to delete
    schema:
      type: string
responses:
  '200':
    description: Contact deleted successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact deleted
  '404':
    $ref: '../../../components/responses/404.yaml'
